name: Sync ThingSpeak to MongoDB

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync sensor data
        run: |
          curl --fail-with-body \
            --request POST \
            --header "X-Sync-Secret: ${{ secrets.SYNC_SECRET }}" \
            https://esp32-environmental-backend.onrender.com/api/sync
